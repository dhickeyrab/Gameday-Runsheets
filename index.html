<!--
  GAMEDAY RUNSHEET — SET UP CLOUD SYNC (SO YOUR TEAM SHARES ONE COPY)
  ---------------------------------------------------------------------
  Without this, the page still works, but each device/browser keeps
  its own separate copy. To share weeks across everyone's phones and
  laptops, set up a free Supabase project (about 10 minutes, no
  coding, no credit card):

  1. Go to https://supabase.com, sign in, and create a new project.
     Pick a region close to you (e.g. Sydney). Set any database
     password — you won't need it for this.
  2. Once the project is ready, open the SQL Editor (left sidebar)
     and run this to create the table this file reads and writes:

       create table kv (
         key text primary key,
         value text,
         updated_at timestamptz default now()
       );
       alter table kv enable row level security;
       create policy "public access" on kv
         for all using (true) with check (true);

  3. Go to Project Settings > API. Copy the "Project URL" and the
     "anon public" key.
  4. In this file, find "const SUPABASE_CONFIG = {" further down and
     paste the URL and anon key in between the matching quotes.
  5. Re-upload this file to GitHub Pages / Netlify. Open it — the
     Weeks panel should show a green "Synced with your team's cloud"
     badge. Send the link to your teammates; you'll all now see the
     same weeks.

  Note on the policy above: "using (true) with check (true)" means
  anyone with your Project URL and anon key can read and write the
  table — no login step for your team, which is fine for gameday
  logistics data. Since those values are visible in this file's
  source once it's deployed anyway, just don't put anything sensitive
  (passwords, personal details) into the runsheet itself. If you ever
  want proper per-person logins instead, Supabase Auth can do that,
  but it's a bigger step than this file sets up.
-->

/* ------------------------------------------------------------
   OPTIONAL CLOUD SYNC — shares runsheet data across devices/people
   Fill in SUPABASE_CONFIG below with your own free Supabase project
   to turn this on (see the setup notes at the top of this file).
   Leave it blank and everything still works exactly as before —
   just saved to this one browser instead of shared with the team.
------------------------------------------------------------ */
const SUPABASE_CONFIG = {
  url: "https://qbedgjeisdrfmadjmgid.supabase.co",
  anonKey: "sb_publishable_mjr-slGFLeuCmJU-lL-jog_DYLB-3gh"
};
let cloudReady = false;
let db = null;

function cloudConfigured(){
  return !!(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey);
}

async function initCloud(){
  if(!cloudConfigured()) return;
  if(typeof supabase === 'undefined'){
    console.log('Supabase library did not load — check your internet connection. Falling back to this device only.');
    return;
  }
  try{
    db = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
    // Quick check that we can actually reach it (and that the kv table exists) before trusting cloud mode.
    const {error} = await db.from('kv').select('key').limit(1);
    if(error) throw error;
    cloudReady = true;
  }catch(e){
    console.log('Cloud sync unavailable, using this device only:', e.message);
    cloudReady = false;
  }
}

/* ------------------------------------------------------------
   STORAGE ADAPTER
   Priority: cloud (Supabase, if configured and reachable) →
   Claude's window.storage (only present inside a Claude artifact) →
   the browser's own localStorage (per device, always available).
   Pass forceLocal:true for anything that should stay per-device
   even when cloud sync is on (e.g. which week you're currently
   looking at — teammates shouldn't have that pulled out from
   under them when someone else switches tabs).
------------------------------------------------------------ */
const hasClaudeStorage = (typeof window !== 'undefined') && !!window.storage;

async function storageGet(key, forceLocal){
  if(cloudReady && !forceLocal){
    try{
      const {data, error} = await db.from('kv').select('value').eq('key', key).maybeSingle();
      if(error) throw error;
      return data ? {key, value: data.value, shared:true} : null;
    }catch(e){ console.error('Cloud read failed, falling back locally:', e); }
  }
  if(hasClaudeStorage) return window.storage.get(key, false);
  const v = localStorage.getItem(key);
  return v===null ? null : {key, value:v, shared:false};
}
async function storageSet(key, value, forceLocal){
  if(cloudReady && !forceLocal){
    try{
      const {error} = await db.from('kv').upsert({key, value, updated_at: new Date().toISOString()});
      if(error) throw error;
      return {key, value, shared:true};
    }catch(e){ console.error('Cloud write failed, falling back locally:', e); }
  }
  if(hasClaudeStorage) return window.storage.set(key, value, false);
  localStorage.setItem(key, value);
  return {key, value, shared:false};
}
async function storageDelete(key, forceLocal){
  if(cloudReady && !forceLocal){
    try{
      const {error} = await db.from('kv').delete().eq('key', key);
      if(error) throw error;
      return {key, deleted:true, shared:true};
    }catch(e){ console.error('Cloud delete failed, falling back locally:', e); }
  }
  if(hasClaudeStorage) return window.storage.delete(key, false);
  localStorage.removeItem(key);
  return {key, deleted:true, shared:false};
}

async function loadDraw(){
  try{
    const res = await fetch('./draw.json', {cache:'no-store'});
    if(!res.ok) throw new Error('draw.json not found (status '+res.status+')');
    const data = await res.json();
    if(!Array.isArray(data.fixtures) || data.fixtures.length===0) throw new Error('draw.json had no fixtures');
    SEASON_FIXTURES = data.fixtures;
    DRAW_AS_OF = data.asOf || 'unknown date';
    DRAW_SOURCE = 'draw.json';
  }catch(e){
    // Quietly keep the built-in snapshot — this is expected if draw.json
    // isn't deployed yet, or the page is opened directly from disk.
    console.log('Using built-in draw snapshot:', e.message);
    DRAW_SOURCE = 'built-in';
  }
}

/* ============================================================
   PERSISTENCE — one entry per week, plus an index of all weeks
============================================================ */
let saveTimer = null;

async function doSave(){
  try{
    await storageSet(weekKey(activeWeekId), JSON.stringify(state));
    const entry = weekIndex.find(w=>w.id===activeWeekId);
    if(entry){
      entry.label = weekLabel(state);
      entry.updatedAt = Date.now();
    }
    await storageSet(INDEX_KEY, JSON.stringify(weekIndex));
    const n = document.getElementById('saveNote');
    const dest = cloudReady ? 'to the team' : 'to this device';
    if(n) n.textContent = `Saved ${dest} ` + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const opt = document.querySelector(`#weekSelect option[value="${activeWeekId}"]`);
    if(opt && entry) opt.textContent = entry.label;
  }catch(e){
    const n = document.getElementById('saveNote');
    if(n) n.textContent = 'Could not save — changes stay on screen only';
    console.error('Storage error', e);
  }
}
function scheduleSave(){
  const note = document.getElementById('saveNote');
  if(note) note.textContent = 'Saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}
async function flushSave(){
  clearTimeout(saveTimer);
  await doSave();
}

async function loadWeekState(id){
  try{
    const r = await storageGet(weekKey(id));
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){ /* fall through */ }
  return blankWeekState();
}
async function persistIndex(){
  try{ await storageSet(INDEX_KEY, JSON.stringify(weekIndex)); }catch(e){ console.error(e); }
}
async function persistActive(){
  try{ await storageSet(ACTIVE_KEY, activeWeekId, true); }catch(e){ console.error(e); }
}

async function loadAllWeeks(){
  try{
    const idxRes = await storageGet(INDEX_KEY);
    weekIndex = (idxRes && idxRes.value) ? JSON.parse(idxRes.value) : [];
  }catch(e){ weekIndex = []; }

  if(weekIndex.length === 0){
    // First run, or upgrading from the old single-runsheet version — migrate it in.
    let legacy = null;
    try{
      const legRes = await storageGet(LEGACY_KEY);
      if(legRes && legRes.value) legacy = JSON.parse(legRes.value);
    }catch(e){ /* none */ }

    const id = uid('w');
    state = legacy || defaultState();
    weekIndex = [{id, label: weekLabel(state), updatedAt: Date.now()}];
    activeWeekId = id;
    try{ await storageSet(weekKey(id), JSON.stringify(state)); }catch(e){}
    await persistIndex();
    await persistActive();
    if(legacy){ try{ await storageDelete(LEGACY_KEY); }catch(e){} }
    return;
  }

  try{
    const actRes = await storageGet(ACTIVE_KEY, true);
    activeWeekId = (actRes && actRes.value) ? actRes.value : weekIndex[0].id;
  }catch(e){ activeWeekId = weekIndex[0].id; }
  if(!weekIndex.find(w=>w.id===activeWeekId)) activeWeekId = weekIndex[0].id;
  state = await loadWeekState(activeWeekId);
}

async function switchWeek(id){
  if(id===activeWeekId) return;
  await flushSave();
  activeWeekId = id;
  await persistActive();
  state = await loadWeekState(id);
  setMode(mode); // full re-render of whichever view is showing
}

async function newWeek(duplicate){
  await flushSave();
  const id = uid('w');
  const newState = duplicate ? JSON.parse(JSON.stringify(state)) : blankWeekState();
  if(duplicate) newState.packing.forEach(p=>p.done=false);
  weekIndex.push({id, label: weekLabel(newState), updatedAt: Date.now()});
  activeWeekId = id;
  state = newState;
  try{ await storageSet(weekKey(id), JSON.stringify(state)); }catch(e){}
  await persistIndex();
  await persistActive();
  renderEdit();
}

async function loadFromDraw(roundNum){
  const fx = SEASON_FIXTURES.find(f=>f.round===roundNum);
  if(!fx) return;
  await flushSave();
  const id = uid('w');
  const newState = blankWeekState();
  newState.match = {
    opponent: fx.opponent,
    round: 'Round ' + fx.round,
    venue: fx.venue,
    dateStr: fx.date
  };
  const ko = newState.anchors.find(a=>a.label==='NRL Kick Off');
  if(ko && fx.kickoff){ ko.time = fx.kickoff; ko.active = true; }
  weekIndex.push({id, label: weekLabel(newState), updatedAt: Date.now()});
  activeWeekId = id;
  state = newState;
  try{ await storageSet(weekKey(id), JSON.stringify(state)); }catch(e){}
  await persistIndex();
  await persistActive();
  renderEdit();
  if(!fx.kickoff){
    alert(`Kick off for Round ${fx.round} vs ${fx.opponent} isn't locked in by the broadcast schedule yet — add it under Key Timings once it's confirmed and everything linked to it will fall into place.`);
  }
}

async function deleteWeek(id){
  if(weekIndex.length<=1){
    alert("This is your only saved week — clear it instead of deleting it.");
    return;
  }
  const entry = weekIndex.find(w=>w.id===id);
  if(!confirm(`Delete "${entry?entry.label:'this week'}"? This can't be undone.`)) return;
  try{ await storageDelete(weekKey(id)); }catch(e){}
  weekIndex = weekIndex.filter(w=>w.id!==id);
  await persistIndex();
  if(activeWeekId===id){
    activeWeekId = weekIndex[0].id;
    await persistActive();
    state = await loadWeekState(activeWeekId);
  }
  renderEdit();
}

/* ============================================================
   TIME HELPERS
============================================================ */
function toMin(t){
  if(!t) return null;
  const p = t.split(':');
  if(p.length<2) return null;
  const h = parseInt(p[0],10), m = parseInt(p[1],10);
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
function fromMin(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function fmt12(t){
  const mins = toMin(t);
  if(mins===null) return '--:--';
  let h = Math.floor(mins/60), m = mins%60;
  const ap = h>=12 ? 'PM':'AM';
  h = h%12; if(h===0) h=12;
  return h+':'+String(m).padStart(2,'0')+' '+ap;
}
function getAnchor(id){ return state.anchors.find(a=>a.id===id); }
function computeItemMin(item){
  if(item.mode==='fixed'){
    return toMin(item.fixedTime);
  }else{
    const anc = getAnchor(item.anchorId);
    if(!anc || !anc.active) return null;
    const base = toMin(anc.time);
    if(base===null) return null;
    return base + (parseInt(item.offsetMin,10)||0);
  }
}
function nowMin(){
  const d = new Date();
  return d.getHours()*60 + d.getMinutes();
}

function moveItem(id, dir){
  const idx = state.items.findIndex(x=>x.id===id);
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=state.items.length) return;
  const tmp = state.items[idx];
  state.items[idx] = state.items[swapIdx];
  state.items[swapIdx] = tmp;
  renderItemsEdit();
  scheduleSave();
}

function refreshComputedBadges(){
  state.items.forEach(it=>{
    const el = document.querySelector(`[data-computed="${it.id}"]`);
    if(!el) return;
    const mins = computeItemMin(it);
    if(mins===null){
      el.textContent = 'N/A';
      el.classList.add('na');
    }else{
      el.textContent = fromMin(mins);
      el.classList.remove('na');
    }
  });
}

   RENDER: GAMEDAY MODE
============================================================ */
function renderGameday(){
  const app = document.getElementById('app');
  const now = nowMin();

  const sortable = state.items
    .map(it=>({it, mins:computeItemMin(it)}))
    .filter(x=>x.mins!==null)
    .sort((a,b)=>a.mins-b.mins);

  // find current (last item at/before now) and next (first after now)
  let currentIdx = -1;
  for(let i=0;i<sortable.length;i++){
    if(sortable[i].mins<=now) currentIdx = i;
  }
  const nextEntry = sortable.find(x=>x.mins>now);

  app.innerHTML = `
    <div class="gd-clock-bar">
      <div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#C9D3CB;margin-bottom:2px;">Now</div>
        <div class="gd-clock" id="gdClock"></div>
      </div>
      <div class="gd-next">
        ${nextEntry ? `
          <div class="eyebrow">Next up</div>
          <div class="next-name">${escHtml(firstLine(nextEntry.it.action)||'—')}</div>
          <div class="next-time">${fromMin(nextEntry.mins)} · in ${nextEntry.mins-now} min</div>
        ` : `<div class="eyebrow">That's the last item on the sheet</div>`}
      </div>
    </div>
    <div class="card">
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="card">
      <h2>Packing list</h2>
      <div class="gd-pack" id="gdPack"></div>
    </div>
    <div class="footer-actions">
      <button class="btn btn-ghost" id="printBtn">Print this view</button>
      <span class="save-note" id="saveNote2"></span>
    </div>
  `;

  const tl = document.getElementById('timeline');
  if(sortable.length===0){
    tl.innerHTML = `<div class="empty-state">No timed items yet — add some in Edit mode.</div>`;
  }else{
    tl.innerHTML = sortable.map((x,i)=>{
      const isPast = i<currentIdx;
      const isNow = i===currentIdx;
      const cls = ['gd-item'];
      if(x.it.milestone) cls.push('milestone');
      if(isPast) cls.push('past');
      if(isNow) cls.push('now');
      const meta = [];
      if(x.it.where) meta.push(`📍 ${escHtml(x.it.where)}`);
      if(x.it.who) meta.push(`👤 ${escHtml(x.it.who)}`);
      return `
        <div class="${cls.join(' ')}">
          <div class="gd-time">${fromMin(x.mins)}</div>
          <div class="gd-body">
            <div class="gd-action">${escHtml(x.it.action)}${isNow?'<span class="now-tag">NOW</span>':''}</div>
            ${meta.length? `<div class="gd-meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  const pk = document.getElementById('gdPack');
  if(state.packing.length===0){
    pk.innerHTML = `<div class="empty-state">Nothing to pack.</div>`;
  }else{
    pk.innerHTML = state.packing.map(p=>`
      <div class="gd-pack-row ${p.done?'checked':''}" data-id="${p.id}">
        <input type="checkbox" class="pk-done" ${p.done?'checked':''}>
        <span>${escHtml(p.text)||'(untitled item)'}</span>
      </div>
    `).join('');
    pk.querySelectorAll('.gd-pack-row').forEach(row=>{
      const id = row.dataset.id;
      row.querySelector('.pk-done').onchange = (e)=>{
        const p = state.packing.find(x=>x.id===id);
        p.done = e.target.checked;
        row.classList.toggle('checked', p.done);
        scheduleSave();
      };
    });
  }

  document.getElementById('printBtn').onclick = ()=> window.print();

  updateClock();
}

function firstLine(s){
  if(!s) return '';
  return s.split('\n')[0];
}

function updateClock(){
  const el = document.getElementById('gdClock');
  if(!el) return;
  const d = new Date();
  el.textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

/* ============================================================
   HEADER / MODE SWITCHING
============================================================ */
function updateHeader(){
  const m = state.match;
  const title = [m.round, m.opponent ? ('vs '+m.opponent) : ''].filter(Boolean).join(' ') || 'Gameday Runsheet';
  document.getElementById('hdrTitle').textContent = title || 'Gameday Runsheet';
  document.getElementById('hdrSub').textContent = [m.venue, m.dateStr].filter(Boolean).join(' · ') || '— · —';
}

function setMode(newMode){
  mode = newMode;
  document.getElementById('btnModeEdit').classList.toggle('active', mode==='edit');
  document.getElementById('btnModeGameday').classList.toggle('active', mode==='gameday');
  clearInterval(clockTimer);
  clearInterval(clockTimer2);
  if(mode==='edit'){
    renderEdit();
  }else{
    renderGameday();
    clockTimer = setInterval(()=>{
      updateClock();
    }, 1000);
    clockTimer2 = setInterval(async ()=>{
      if(cloudReady){
        try{ state = await loadWeekState(activeWeekId); }
        catch(e){ console.error('Could not refresh from cloud', e); }
      }
      renderGameday();
    }, cloudReady ? 15000 : 30000);
  }
  updateHeader();
}
let clockTimer2 = null;

/* ============================================================
   UTIL
============================================================ */
function escHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s){
  return escHtml(s).replace(/"/g,'&quot;');
}

/* ============================================================
   INIT
============================================================ */
async function init(){
  document.getElementById('app').innerHTML = `<div class="empty-state">Loading your runsheet…</div>`;
  await initCloud();
  await Promise.all([loadAllWeeks(), loadDraw()]);
  document.getElementById('btnModeEdit').onclick = ()=>setMode('edit');
  document.getElementById('btnModeGameday').onclick = ()=>setMode('gameday');
  setMode('edit');
}
init();
</script>
